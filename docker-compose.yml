version: '3.8'

services:
  portfolio:
    build: .
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - portfolio-network

  admin:
    build: .
    ports:
      - "8502:8502"
    environment:
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./data:/app/data
    command: ["streamlit", "run", "admin.py", "--server.port=8502", "--server.address=0.0.0.0"]
    restart: unless-stopped
    networks:
      - portfolio-network
    depends_on:
      - portfolio

networks:
  portfolio-network:
    driver: bridge

volumes:
  portfolio-data: